<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Dark Espresso Squircle - Perfectly edge-to-edge -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#321E15" />
      <stop offset="35%" stop-color="#24140D" />
      <stop offset="100%" stop-color="#120804" />
    </linearGradient>

    <!-- Warm Golden Ambient Rim -->
    <linearGradient id="squircleBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D49B5B" stop-opacity="0.85" />
      <stop offset="40%" stop-color="#7C4822" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#B8783E" stop-opacity="0.75" />
    </linearGradient>

    <!-- Warm Ambient Center Radial Glow behind bars -->
    <radialGradient id="ambientGlow" cx="50%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.38" />
      <stop offset="45%" stop-color="#B45309" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#120804" stop-opacity="0" />
    </radialGradient>

    <!-- Equalizer Column Standard Gradient -->
    <linearGradient id="eqBarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE8A3" />
      <stop offset="25%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#A14E15" />
      <stop offset="100%" stop-color="#542407" />
    </linearGradient>

    <!-- Center Tallest Bar Gradient -->
    <linearGradient id="centerBarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="18%" stop-color="#FEF08A" />
      <stop offset="55%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <!-- Glowing Book Page Surface Left -->
    <linearGradient id="pageLeftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF0D5" />
      <stop offset="35%" stop-color="#E5AF6E" />
      <stop offset="80%" stop-color="#995826" />
      <stop offset="100%" stop-color="#5A2E0F" />
    </linearGradient>

    <!-- Glowing Book Page Surface Right -->
    <linearGradient id="pageRightGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDF0D5" />
      <stop offset="35%" stop-color="#E5AF6E" />
      <stop offset="80%" stop-color="#995826" />
      <stop offset="100%" stop-color="#5A2E0F" />
    </linearGradient>

    <!-- Book Metallic Border Trim -->
    <linearGradient id="goldTrim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B2743D" />
      <stop offset="50%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#B2743D" />
    </linearGradient>

    <!-- Lower Page Tier Gradient -->
    <linearGradient id="pageTierGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8C4E20" />
      <stop offset="100%" stop-color="#3A1C09" />
    </linearGradient>

    <!-- Sine Wave Ribbon Glow -->
    <linearGradient id="sineGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" stop-opacity="0.2" />
      <stop offset="18%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#FFFBEB" />
      <stop offset="82%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" stop-opacity="0.3" />
    </linearGradient>

    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="strongGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="b2" />
      <feMerge>
        <feMergeNode in="b2" />
        <feMergeNode in="b1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 1. Pure Edge-to-Edge Squircle App Icon (No surrounding extra margin/border) -->
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#bgGrad)" stroke="url(#squircleBorder)" stroke-width="4.5" />

  <!-- 2. Ambient Warm Center Glow -->
  <circle cx="256" cy="250" r="180" fill="url(#ambientGlow)" />

  <!-- 3. Seven Equalizer Columns (Rising from Book) -->
  <g>
    <!-- Col 1 (Far Left) -->
    <rect x="165" y="196" width="16" height="96" rx="4.5" fill="url(#eqBarGrad)" stroke="#FFE8A3" stroke-width="1" stroke-opacity="0.6" />

    <!-- Col 2 -->
    <rect x="192" y="152" width="17" height="140" rx="4.5" fill="url(#eqBarGrad)" stroke="#FFE8A3" stroke-width="1.2" stroke-opacity="0.75" />

    <!-- Col 3 -->
    <rect x="220" y="174" width="17" height="118" rx="4.5" fill="url(#eqBarGrad)" stroke="#FFE8A3" stroke-width="1.2" stroke-opacity="0.8" />

    <!-- Col 4 (Center Tallest - Radiant) -->
    <g filter="url(#glowEffect)">
      <rect x="247.5" y="122" width="17" height="170" rx="4.5" fill="url(#centerBarGrad)" stroke="#FFFFFF" stroke-width="1.5" />
    </g>

    <!-- Col 5 -->
    <rect x="275" y="166" width="17" height="126" rx="4.5" fill="url(#eqBarGrad)" stroke="#FFE8A3" stroke-width="1.2" stroke-opacity="0.8" />

    <!-- Col 6 -->
    <rect x="303" y="144" width="17" height="148" rx="4.5" fill="url(#eqBarGrad)" stroke="#FFE8A3" stroke-width="1.2" stroke-opacity="0.75" />

    <!-- Col 7 (Far Right) -->
    <rect x="331" y="188" width="16" height="104" rx="4.5" fill="url(#eqBarGrad)" stroke="#FFE8A3" stroke-width="1" stroke-opacity="0.6" />
  </g>

  <!-- 4. Pure Vector Open Book Geometric Art -->
  <g id="openBook">
    <!-- Bottom Cover Base Outline Frame -->
    <path d="M100 376 L140 286 C176 280 216 288 256 306 C296 288 336 280 372 286 L412 376 C366 367 316 376 268 386 C260 388 252 388 244 386 C196 376 146 367 100 376 Z"
          fill="#1C0E07" stroke="url(#goldTrim)" stroke-width="3.5" stroke-linejoin="round" />

    <!-- Lower Page Wing Layers (Left & Right) -->
    <path d="M124 364 L148 288 C182 284 220 293 252 310 V354 C216 344 174 348 124 364 Z"
          fill="url(#pageTierGrad)" stroke="url(#goldTrim)" stroke-width="1.8" />
    <path d="M388 364 L364 288 C330 284 292 293 260 310 V354 C296 344 338 348 388 364 Z"
          fill="url(#pageTierGrad)" stroke="url(#goldTrim)" stroke-width="1.8" />

    <!-- Top Shimmering Glowing Pages -->
    <!-- Left Main Page -->
    <path d="M136 346 L158 278 C192 274 228 282 254 298 V364 C226 352 188 346 136 346 Z"
          fill="url(#pageLeftGrad)" stroke="#FDE68A" stroke-width="2.5" stroke-linejoin="round" />
    
    <!-- Right Main Page -->
    <path d="M376 346 L354 278 C320 274 284 282 258 298 V364 C286 352 324 346 376 346 Z"
          fill="url(#pageRightGrad)" stroke="#FDE68A" stroke-width="2.5" stroke-linejoin="round" />

    <!-- Center Book Spine Crease Depth -->
    <path d="M256 298 V378" stroke="#421E0B" stroke-width="4.5" stroke-linecap="round" />
    <path d="M256 298 V374" stroke="#180A04" stroke-width="2" stroke-linecap="round" />

    <!-- Bottom Saddle Arch Rim -->
    <path d="M230 378 C242 388 270 388 282 378" stroke="#FDE68A" stroke-width="3.5" stroke-linecap="round" fill="none" />
  </g>

  <!-- 5. Continuous Speech Sine Wave Glow Ribbon -->
  <g filter="url(#strongGlow)">
    <!-- Broad Ambient Glow Wave -->
    <path d="M96 242 C132 270 164 220 198 238 C232 256 244 284 268 258 C292 232 314 198 344 224 C372 248 392 230 416 224" 
          stroke="url(#sineGlow)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.8" />
    
    <!-- Sharp Golden Wave -->
    <path d="M96 242 C132 270 164 220 198 238 C232 256 244 284 268 258 C292 232 314 198 344 224 C372 248 392 230 416 224" 
          stroke="url(#sineGlow)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Bright White Core Filament -->
    <path d="M96 242 C132 270 164 220 198 238 C232 256 244 284 268 258 C292 232 314 198 344 224 C372 248 392 230 416 224" 
          stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.95" />
  </g>
</svg>