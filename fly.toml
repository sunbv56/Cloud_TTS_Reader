app = "cloud-tts-reader"
primary_region = 'sjc'

[build]

[env]
  MALLOC_CONF = "background_thread:false,dirty_decay_ms:1000,muzzy_decay_ms:1000,narenas:1"
  MALLOC_TRIM_THRESHOLD_ = "65536"
  LD_PRELOAD = "/usr/lib/x86_64-linux-gnu/libjemalloc.so.2"
  PYTHONOPTIMIZE = "2"
  PYTHONDONTWRITEBYTECODE = "1"
  PYTHONUNBUFFERED = "1"
  GRPC_ENABLE_FORK_SUPPORT = "0"
  GRPC_POLL_STRATEGY = "epoll1"
  GRPC_PYTHON_BUILD_SYSTEM_OPENSSL = "1"

[http_service]
  internal_port = 8008
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
