app = "cloud-tts-reader"
primary_region = 'iad'

[build]

[env]
  MALLOC_TRIM_THRESHOLD_ = "65536"
  LD_PRELOAD = "/usr/lib/x86_64-linux-gnu/libjemalloc.so.2"
  PYTHONUNBUFFERED = "1"

[http_service]
  internal_port = 8008
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
