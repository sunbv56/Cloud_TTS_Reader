# fly.toml app configuration file generated for cloud-tts-reader on 2026-05-10T03:39:36Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'cloud-tts-reader'
primary_region = 'iad'

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
